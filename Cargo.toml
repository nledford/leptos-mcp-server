[package]
name = "leptos-mcp-server"
version = "0.1.0"
edition = "2024"
description = "MCP Server for Leptos framework documentation and tools"
authors = ["kneiht", "Nathaniel Ledford <nate@nateledford.com>"]
license = "MIT"
rust-version = "1.96"

[workspace]

[features]
default = ["stdio"]
stdio = ["rust-mcp-sdk/stdio"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"] }
tokio-stream = "0.1"

# MCP SDK
rust-mcp-sdk = { version = "0.9.0", default-features = false, features = ["server", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
