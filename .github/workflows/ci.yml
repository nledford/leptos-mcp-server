name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install MSRV
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Check MSRV
        run: cargo +1.96.0 check --locked
      - name: Format
        run: cargo fmt -- --check
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release --locked
      - name: Binary smoke
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | ./target/release/leptos-mcp-server \
            > /tmp/leptos-mcp-smoke.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(Path("/tmp/leptos-mcp-smoke.json").read_text())
          assert response["jsonrpc"] == "2.0"
          assert response["id"] == 1
          tools = response["result"]["tools"]
          assert isinstance(tools, list) and tools
          PY
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@492cad282ff2bc751208d9bdcbbcce57c3a90925 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - name: Coverage
        run: cargo llvm-cov --locked --summary-only --fail-under-lines 70
      - name: Install cargo-audit
        uses: taiki-e/install-action@08b635a8ab62d28d92494f1a6ebd22feeb2be229 # cargo-audit
        with:
          tool: cargo-audit
      - name: Audit
        run: cargo audit
      - name: Install cargo-deny
        uses: taiki-e/install-action@894ed6ded408bba4b650a982305dc5353e661648 # cargo-deny
        with:
          tool: cargo-deny
      - name: Dependency policy
        run: cargo deny check
