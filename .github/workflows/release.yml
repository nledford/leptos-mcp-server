name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify validated main
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      current: ${{ steps.current-main.outputs.current }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm validated commit is current main
        id: current-main
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(git rev-parse HEAD)"
          if [ "$current_sha" != "$VALIDATED_SHA" ]; then
            echo "Validated commit $VALIDATED_SHA is no longer current main ($current_sha)."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "current=true" >> "$GITHUB_OUTPUT"

  release-plz-release:
    name: Create tags and GitHub releases
    needs: preflight
    if: needs.preflight.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Confirm release commit is still validated main
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"

          if [ "$current_sha" != "$VALIDATED_SHA" ]; then
            echo "Checked out $current_sha, expected validated commit $VALIDATED_SHA."
            exit 1
          fi

          if [ "$main_sha" != "$VALIDATED_SHA" ]; then
            echo "Current main is $main_sha, not validated commit $VALIDATED_SHA."
            exit 1
          fi

      - name: Run release-plz release
        uses: release-plz/action@d22c02a7cf6d7870bd163be7c7d9518d331aef34
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  release-plz-pr:
    name: Create or update release PR
    needs:
      - preflight
      - release-plz-release
    if: needs.preflight.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Confirm release PR base is still validated main
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"

          if [ "$current_sha" != "$VALIDATED_SHA" ]; then
            echo "Checked out $current_sha, expected validated commit $VALIDATED_SHA."
            exit 1
          fi

          if [ "$main_sha" != "$VALIDATED_SHA" ]; then
            echo "Current main is $main_sha, not validated commit $VALIDATED_SHA."
            exit 1
          fi

      - name: Run release-plz release-pr
        uses: release-plz/action@d22c02a7cf6d7870bd163be7c7d9518d331aef34
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
